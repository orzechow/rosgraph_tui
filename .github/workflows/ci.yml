name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: unit (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .[dev]
      - run: ruff check rosgraph_tui test scripts
      - run: pytest -m "not ros"

  ros-jazzy:
    name: ROS 2 Jazzy (rclpy integration + colcon)
    runs-on: ubuntu-latest
    container: ros:jazzy-ros-core
    env:
      ROS_DOMAIN_ID: 42
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-pip python3-venv python3-colcon-common-extensions git
      - name: Install package into a venv that sees the ROS 2 Python packages
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install -e .[dev]
      - name: Run all tests including the rclpy integration test
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          .venv/bin/pytest -v
      - name: Build as an ament_python package and check the executable
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          mkdir -p ws/src && cp -r "$PWD" ws/src/rosgraph_tui || true
          cd ws && colcon build --packages-select rosgraph_tui
          source install/setup.bash
          ros2 pkg executables rosgraph_tui | grep rosgraph_tui
          ros2 run rosgraph_tui rosgraph_tui --version
